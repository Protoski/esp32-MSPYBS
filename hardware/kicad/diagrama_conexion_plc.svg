<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="system-ui, Arial, sans-serif">
  <rect width="1100" height="700" fill="#0f172a"/>
  <text x="550" y="35" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="bold">Conexion de un sensor 4-20mA compartido con el PLC (via aislador)</text>
  <text x="550" y="58" text-anchor="middle" fill="#94a3b8" font-size="13">Se repite igual para cada uno de los 9 canales analogicos</text>

  <!-- Fuente 24V del lazo (existente) -->
  <rect x="30" y="120" width="130" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="95" y="150" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Fuente 24V</text>
  <text x="95" y="170" text-anchor="middle" fill="#94a3b8" font-size="11">del lazo (existente)</text>
  <text x="45" y="135" fill="#22c55e" font-size="12" font-weight="bold">+</text>
  <text x="145" y="135" fill="#ef4444" font-size="12" font-weight="bold">-</text>

  <!-- Transmisor -->
  <rect x="220" y="100" width="150" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="295" y="125" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">Transmisor</text>
  <text x="295" y="142" text-anchor="middle" fill="#94a3b8" font-size="11">(el mismo sensor</text>
  <text x="295" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">que ya existe)</text>
  <circle cx="235" cy="185" r="4" fill="#22c55e"/>
  <text x="245" y="189" fill="#e2e8f0" font-size="11">24V</text>
  <circle cx="355" cy="185" r="4" fill="#facc15"/>
  <text x="290" y="189" fill="#e2e8f0" font-size="11">4-20mA</text>

  <!-- Aislador de lazo -->
  <rect x="440" y="80" width="220" height="200" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="3"/>
  <text x="550" y="105" text-anchor="middle" fill="#f97316" font-size="15" font-weight="bold">Aislador / Divisor</text>
  <text x="550" y="122" text-anchor="middle" fill="#f97316" font-size="15" font-weight="bold">de lazo 4-20mA</text>
  <text x="550" y="142" text-anchor="middle" fill="#94a3b8" font-size="11">(componente NUEVO)</text>

  <text x="460" y="165" fill="#e2e8f0" font-size="11" font-weight="bold">Lado PRIMARIO (entrada):</text>
  <circle cx="460" cy="178" r="3" fill="#facc15"/><text x="470" y="182" fill="#94a3b8" font-size="10">Loop+ (del transmisor)</text>
  <circle cx="460" cy="192" r="3" fill="#94a3b8"/><text x="470" y="196" fill="#94a3b8" font-size="10">Loop- (hacia el PLC)</text>

  <text x="460" y="215" fill="#e2e8f0" font-size="11" font-weight="bold">Alim. auxiliar (24V, separada):</text>
  <circle cx="460" cy="228" r="3" fill="#22c55e"/><text x="470" y="232" fill="#94a3b8" font-size="10">+24V aux</text>
  <circle cx="460" cy="242" r="3" fill="#ef4444"/><text x="470" y="246" fill="#94a3b8" font-size="10">GND aux</text>

  <text x="460" y="265" fill="#e2e8f0" font-size="11" font-weight="bold">Lado SECUNDARIO (salida aislada):</text>
  <circle cx="630" cy="278" r="3" fill="#a78bfa"/>

  <!-- PLC -->
  <rect x="760" y="60" width="160" height="100" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="840" y="90" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">PLC Siemens</text>
  <text x="840" y="108" text-anchor="middle" fill="#94a3b8" font-size="11">Entrada Analogica</text>
  <text x="840" y="124" text-anchor="middle" fill="#94a3b8" font-size="11">(sigue igual que antes)</text>
  <circle cx="775" cy="145" r="4" fill="#94a3b8"/>

  <!-- ESP32 side: resistor + ADS1115 -->
  <rect x="760" y="330" width="160" height="90" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="840" y="358" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">ADS1115</text>
  <text x="840" y="376" text-anchor="middle" fill="#94a3b8" font-size="11">canal AIN0-3</text>
  <text x="840" y="392" text-anchor="middle" fill="#94a3b8" font-size="11">(hacia el ESP32 I2C)</text>
  <circle cx="775" cy="405" r="4" fill="#a78bfa"/>

  <!-- Resistor 150R -->
  <g transform="translate(630,340)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#facc15" stroke-width="2"/>
    <rect x="-15" y="20" width="30" height="55" fill="#334155" stroke="#fbbf24" stroke-width="2"/>
    <text x="35" y="50" fill="#fbbf24" font-size="13" font-weight="bold">150 Ohm</text>
    <line x1="0" y1="75" x2="0" y2="95" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Wires -->
  <path d="M160 135 L235 185" stroke="#22c55e" stroke-width="2" fill="none"/>
  <path d="M355 185 L460 178" stroke="#facc15" stroke-width="2" fill="none"/>
  <path d="M460 192 L775 145" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Aux power to isolator -->
  <text x="500" y="300" fill="#22c55e" font-size="11">(alim. auxiliar del aislador,</text>
  <text x="500" y="315" fill="#22c55e" font-size="11">puede ser la misma fuente 24V)</text>

  <!-- Secondary loop to ESP32 -->
  <path d="M630 278 L630 340" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <path d="M630 340 L630 395 L775 405" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <path d="M630 395 L775 405" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <circle cx="630" cy="278" r="3" fill="#a78bfa"/>
  <text x="645" y="282" fill="#a78bfa" font-size="10">nuevo lazo, solo</text>
  <text x="645" y="295" fill="#a78bfa" font-size="10">para el ESP32</text>

  <!-- Labels for existing vs new -->
  <rect x="30" y="470" width="500" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="50" y="495" fill="#22c55e" font-size="13" font-weight="bold">Verde/amarillo/gris = cableado existente, no se toca la logica</text>
  <text x="50" y="515" fill="#94a3b8" font-size="12">El PLC sigue viendo exactamente la misma señal 4-20mA de siempre.</text>
  <text x="50" y="530" fill="#94a3b8" font-size="12">Solo se corta el cable una vez para insertar el aislador en el medio.</text>

  <rect x="570" y="470" width="500" height="70" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="590" y="495" fill="#a78bfa" font-size="13" font-weight="bold">Violeta = lazo nuevo, exclusivo del ESP32</text>
  <text x="590" y="515" fill="#94a3b8" font-size="12">Circuito identico al ya diseñado (resistencia 150Ohm + ADS1115).</text>
  <text x="590" y="530" fill="#94a3b8" font-size="12">Totalmente aislado galvanicamente del lado del PLC.</text>

  <text x="30" y="600" fill="#64748b" font-size="12">Nota: el tipo exacto de aislador (2 hilos autoalimentado vs 4 hilos con alimentacion auxiliar)</text>
  <text x="30" y="618" fill="#64748b" font-size="12">depende del modelo que se consiga -- verificar su hoja de datos antes de cablear.</text>
</svg>
