<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="system-ui, Arial, sans-serif">
  <rect width="1100" height="720" fill="#0f172a"/>
  <text x="550" y="35" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="bold">Sensado por efecto Hall (sin cortar la logica del lazo)</text>
  <text x="550" y="58" text-anchor="middle" fill="#94a3b8" font-size="13">Se repite igual para cada uno de los 9 canales analogicos</text>

  <!-- Transmisor -->
  <rect x="40" y="90" width="180" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="130" y="118" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">Sensor 4-20mA</text>
  <text x="130" y="135" text-anchor="middle" fill="#94a3b8" font-size="11">(el mismo transmisor</text>
  <text x="130" y="149" text-anchor="middle" fill="#94a3b8" font-size="11">que ya existe)</text>
  <circle cx="60" cy="175" r="5" fill="#22c55e"/>
  <text x="72" y="179" fill="#e2e8f0" font-size="12" font-weight="bold">+</text>
  <circle cx="190" cy="175" r="5" fill="#94a3b8"/>
  <text x="175" y="163" fill="#e2e8f0" font-size="12" font-weight="bold">-</text>

  <!-- PLC -->
  <rect x="880" y="90" width="180" height="110" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="970" y="125" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">PLC Siemens</text>
  <text x="970" y="145" text-anchor="middle" fill="#94a3b8" font-size="11">Entrada Analogica</text>
  <text x="970" y="160" text-anchor="middle" fill="#94a3b8" font-size="11">(sigue igual que antes)</text>
  <circle cx="900" cy="175" r="5" fill="#22c55e"/>
  <circle cx="900" cy="145" r="5" fill="#94a3b8"/>

  <!-- Cable negativo directo (no pasa por el sensor) -->
  <path d="M190 175 L900 145" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <text x="500" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">cable "-" va directo, NO pasa por el sensor</text>

  <!-- Cable positivo: baja, se corta, pasa por el sensor -->
  <path d="M60 175 L60 320" stroke="#22c55e" stroke-width="2" fill="none"/>

  <!-- Punto de corte/empalme 1 -->
  <circle cx="60" cy="320" r="6" fill="#f87171"/>
  <text x="75" y="315" fill="#f87171" font-size="11" font-weight="bold">corte / empalme 1</text>
  <path d="M60 320 L60 380" stroke="#22c55e" stroke-width="2" fill="none"/>

  <!-- Toroide con 50 vueltas (representacion esquematica) -->
  <g transform="translate(60,420)">
    <ellipse cx="0" cy="0" rx="55" ry="80" fill="none" stroke="#334155" stroke-width="18"/>
    <text x="-70" y="-90" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">ACS712 (5A)</text>
    <text x="0" y="0" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">cable "+"</text>
    <text x="0" y="14" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">enroscado</text>
    <text x="0" y="28" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">40-50 vueltas</text>
    <path d="M0 -80 L0 80" stroke="#22c55e" stroke-width="2" fill="none"/>
  </g>

  <!-- Punto de corte/empalme 2 -->
  <path d="M60 500 L60 560" stroke="#22c55e" stroke-width="2" fill="none"/>
  <circle cx="60" cy="560" r="6" fill="#f87171"/>
  <text x="75" y="565" fill="#f87171" font-size="11" font-weight="bold">corte / empalme 2</text>

  <!-- Sigue hacia el PLC -->
  <path d="M60 560 L60 620 L900 175" stroke="#22c55e" stroke-width="2" fill="none"/>
  <text x="400" y="600" fill="#22c55e" font-size="11">mismo cable "+", continua intacto hacia el PLC</text>

  <!-- ACS712 -> ESP32/ADS1115 -->
  <rect x="220" y="380" width="220" height="130" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="330" y="405" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="bold">Hacia ESP32 / ADS1115</text>
  <text x="345" y="430" fill="#e2e8f0" font-size="11">VCC</text>
  <circle cx="330" cy="427" r="4" fill="#22c55e"/>
  <text x="240" y="430" fill="#e2e8f0" font-size="11">→ 5V</text>
  <text x="345" y="452" fill="#e2e8f0" font-size="11">GND</text>
  <circle cx="330" cy="449" r="4" fill="#94a3b8"/>
  <text x="240" y="452" fill="#e2e8f0" font-size="11">→ masa comun</text>
  <text x="345" y="474" fill="#e2e8f0" font-size="11">OUT</text>
  <circle cx="330" cy="471" r="4" fill="#fbbf24"/>
  <text x="240" y="474" fill="#e2e8f0" font-size="11">→ ADS1115 AINx</text>
  <path d="M115 430 L220 427" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M115 430 L220 449" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M115 430 L220 471" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <!-- Formula -->
  <rect x="480" y="380" width="380" height="130" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="405" fill="#22c55e" font-size="13" font-weight="bold">Formula (en el firmware):</text>
  <text x="500" y="430" fill="#e2e8f0" font-size="12">corriente_mA = (V_ADS1115 - 2.5V)</text>
  <text x="520" y="448" fill="#e2e8f0" font-size="12">/ (0.185 V/A x vueltas) x 1000</text>
  <text x="500" y="475" fill="#94a3b8" font-size="11">Calibrar el cero y la pendiente reales</text>
  <text x="500" y="490" fill="#94a3b8" font-size="11">con una fuente de 4mA y 20mA conocida.</text>

  <!-- Leyenda inferior -->
  <rect x="40" y="630" width="500" height="70" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="60" y="655" fill="#f87171" font-size="13" font-weight="bold">Puntos rojos = donde se corta y se vuelve a unir</text>
  <text x="60" y="675" fill="#94a3b8" font-size="12">El empalme debe quedar solido (soldado + termocontraible</text>
  <text x="60" y="690" fill="#94a3b8" font-size="12">o bornera), como UN SOLO conductor continuo.</text>

  <rect x="570" y="630" width="500" height="70" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="590" y="655" fill="#a78bfa" font-size="13" font-weight="bold">Aislamiento: 100% magnetico, cero contacto electrico</text>
  <text x="590" y="675" fill="#94a3b8" font-size="12">Solo pasa el cable "+"; si pasaran los dos cables juntos,</text>
  <text x="590" y="690" fill="#94a3b8" font-size="12">los campos se cancelan y no se mide nada.</text>
</svg>
