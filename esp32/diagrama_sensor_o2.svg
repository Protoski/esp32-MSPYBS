<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="system-ui, Arial, sans-serif">
  <rect width="900" height="650" fill="#0f172a"/>
  <text x="450" y="35" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="bold">Conexion Sensor O2 (4-20mA / 24V) -- ESP32</text>

  <!-- Fuente 24V -->
  <rect x="40" y="90" width="140" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="110" y="125" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">Fuente 24V</text>
  <text x="110" y="150" text-anchor="middle" fill="#94a3b8" font-size="13">DC</text>
  <text x="60" y="105" fill="#22c55e" font-size="13" font-weight="bold">+</text>
  <text x="160" y="105" fill="#ef4444" font-size="13" font-weight="bold">-</text>

  <!-- Sensor O2 -->
  <rect x="320" y="60" width="220" height="160" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="430" y="90" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">Sensor O2</text>
  <text x="430" y="110" text-anchor="middle" fill="#94a3b8" font-size="12">Salida 4-20mA</text>

  <circle cx="335" cy="140" r="5" fill="#22c55e"/>
  <text x="350" y="145" fill="#e2e8f0" font-size="13">+  (alimentacion 24V)</text>

  <circle cx="335" cy="170" r="5" fill="#facc15"/>
  <text x="350" y="175" fill="#e2e8f0" font-size="13">4-20mA OUTPUT</text>

  <circle cx="335" cy="200" r="5" fill="#94a3b8"/>
  <text x="350" y="205" fill="#e2e8f0" font-size="13">Ground</text>

  <!-- ESP32 -->
  <rect x="650" y="250" width="180" height="280" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="740" y="285" text-anchor="middle" fill="#a78bfa" font-size="16" font-weight="bold">ESP32</text>

  <circle cx="660" cy="340" r="5" fill="#facc15"/>
  <text x="675" y="345" fill="#e2e8f0" font-size="13">GPIO 34 (ADC1_CH6)</text>

  <circle cx="660" cy="430" r="5" fill="#94a3b8"/>
  <text x="675" y="435" fill="#e2e8f0" font-size="13">GND</text>

  <!-- Wires: 24V+ -> sensor + -->
  <path d="M180 105 L335 140" stroke="#22c55e" stroke-width="2" fill="none"/>

  <!-- Sensor 4-20mA output -> node before resistor -->
  <path d="M335 170 L420 170 L420 340" stroke="#facc15" stroke-width="2" fill="none"/>
  <circle cx="420" cy="170" r="3" fill="#facc15"/>

  <!-- node -> GPIO34 -->
  <path d="M420 340 L660 340" stroke="#facc15" stroke-width="2" fill="none"/>
  <circle cx="420" cy="340" r="4" fill="#facc15"/>

  <!-- Resistor 150 ohm from node down to GND rail -->
  <g transform="translate(420,340)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#facc15" stroke-width="2"/>
    <rect x="-15" y="40" width="30" height="60" fill="#334155" stroke="#fbbf24" stroke-width="2"/>
    <text x="40" y="80" fill="#fbbf24" font-size="14" font-weight="bold">R = 150 Ohm</text>
    <text x="40" y="100" fill="#94a3b8" font-size="12">(1% precision)</text>
    <line x1="0" y1="100" x2="0" y2="140" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- GND rail horizontal -->
  <path d="M420 480 L660 480 L660 430" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <circle cx="420" cy="480" r="3" fill="#94a3b8"/>

  <!-- Sensor Ground -> GND rail -->
  <path d="M335 200 L300 200 L300 480 L420 480" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- 24V- -> GND rail (common reference) -->
  <path d="M180 145 L180 560 L660 560 L660 480" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <text x="350" y="580" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">Referencia comun: 24V(-) y GND ESP32 deben unirse</text>

  <!-- Zener protection -->
  <g transform="translate(520,340)">
    <text x="0" y="-15" fill="#f87171" font-size="12" font-weight="bold">Opcional: Zener 3.3V</text>
    <text x="0" y="0" fill="#f87171" font-size="12">en paralelo GPIO34-GND</text>
    <text x="0" y="15" fill="#f87171" font-size="12">como proteccion extra</text>
  </g>

  <!-- Calibration box -->
  <rect x="40" y="430" width="320" height="170" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="460" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="bold">Calculo del voltaje en R</text>
  <text x="60" y="490" fill="#e2e8f0" font-size="13">V = I x R</text>
  <text x="60" y="515" fill="#e2e8f0" font-size="13">4 mA  x 150 Ohm = 0.60 V  -&gt; ADC ~ 745</text>
  <text x="60" y="540" fill="#e2e8f0" font-size="13">20 mA x 150 Ohm = 3.00 V  -&gt; ADC ~ 3724</text>
  <text x="60" y="570" fill="#94a3b8" font-size="12">Rango ADC ESP32: 0-3.3V (0-4095, 12 bits)</text>

  <!-- Legend -->
  <text x="40" y="630" fill="#64748b" font-size="12">Linea verde: 24V+   |   Amarilla: senal 4-20mA   |   Gris: GND   |   Roja punteada: referencia comun</text>
</svg>
